<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel de Control – AFcS</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 16px; margin-top: 20px; }
    .stat-card { background: linear-gradient(135deg, #003366 0%, #00244f 100%); color: #fff; padding: 20px; border-radius: 8px; text-align: center; }
    .stat-card h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
    .stat-card .number { font-size: 2.5rem; font-weight: 700; }
    .table-container { background: #fff; border-radius: 8px; padding: 16px; margin-top: 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    table th { background: #f0f4f8; padding: 10px; text-align: left; border-bottom: 2px solid #ddd; }
    table td { padding: 10px; border-bottom: 1px solid #eee; }
    table tr:hover { background: #f9f9f9; }
    .action-btn { background: #00b894; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; margin-right: 6px; }
    .action-btn:hover { background: #00916c; }
    .delete-btn { background: #e74c3c; }
    .delete-btn:hover { background: #c0392b; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
    .modal.show { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: #fff; border-radius: 8px; padding: 24px; max-width: 600px; width: 90%; }
    .modal-header { margin-bottom: 16px; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; float: right; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container">
    <h1 class="brand">AFcS <span class="muted">Admin</span></h1>
    <nav class="main-nav">
      <a id="admin-name"></a>
      <a href="#" onclick="logout()">Cerrar sesión</a>
    </nav>
  </div>
</header>

<main class="container">
  <h2>Panel de Control</h2>
  
  <div class="admin-grid">
    <div class="stat-card">
      <h3>Total Actividades</h3>
      <div class="number" id="total-actividades">-</div>
    </div>
    <div class="stat-card">
      <h3>Total Inscritos</h3>
      <div class="number" id="total-inscritos">-</div>
    </div>
    <div class="stat-card">
      <h3>Usuarios Registrados</h3>
      <div class="number" id="total-usuarios">-</div>
    </div>
  </div>

  <div style="margin-top: 24px;">
    <div style="display: flex; gap: 10px;">
      <button class="btn-primary" onclick="showNewActivityModal()">+ Nueva Actividad</button>
      <button class="btn-ghost" onclick="refreshData()">Actualizar</button>
    </div>
  </div>

  <div class="table-container">
    <h3>Actividades y Inscripciones</h3>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>ECTS</th>
          <th>Inscritos</th>
          <th>Máximo</th>
          <th>Disponibles</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="actividades-tbody">
        <tr><td colspan="6" style="text-align:center;">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Modal para nueva actividad -->
<div id="activity-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <button class="modal-close" onclick="hideNewActivityModal()">&times;</button>
      <h3>Nueva Actividad</h3>
    </div>
    <form id="new-activity-form">
      <input type="text" id="act-nombre" placeholder="Nombre" required style="width:100%;padding:8px;margin:8px 0;border-radius:4px;border:1px solid #ccc">
      <textarea id="act-descripcion" placeholder="Descripción" style="width:100%;padding:8px;margin:8px 0;border-radius:4px;border:1px solid #ccc;min-height:100px"></textarea>
      <input type="number" id="act-ects" placeholder="ECTS" value="1" style="width:100%;padding:8px;margin:8px 0;border-radius:4px;border:1px solid #ccc">
      <input type="date" id="act-inicio" placeholder="Fecha inicio" required style="width:100%;padding:8px;margin:8px 0;border-radius:4px;border:1px solid #ccc">
      <input type="date" id="act-fin" placeholder="Fecha fin" required style="width:100%;padding:8px;margin:8px 0;border-radius:4px;border:1px solid #ccc">
      <input type="number" id="act-max" placeholder="Máximo inscritos" value="50" style="width:100%;padding:8px;margin:8px 0;border-radius:4px;border:1px solid #ccc">
      <button type="submit" class="btn-primary">Crear</button>
    </form>
  </div>
</div>

<script src="js/admin-dashboard.js" defer></script>
</body>
</html>
