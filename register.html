<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear cuenta – AFcS Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <h1 class="brand">AFcS <span class="muted">Portal</span></h1>
  </div>
</header>
<nav>
  <a href="dashboard.html">🏠 Inicio</a>
  <a href="catalogo.html">🗂️ Catálogo</a>
  <a href="progreso.html">🎓 Mi progreso</a>
  <a href="inscripciones.html">📝 Mis inscripciones</a>
  <a href="register.html">🔐 Crear cuenta</a>
</nav>
<main>
  <div class="card" style="max-width:480px;margin:auto;">
    <form id="register-form">
      <label>Nombre (opcional)<br>
        <input type="text" name="nombre" id="nombre" placeholder="Tu nombre" style="width:100%;padding:8px;margin-top:6px;border-radius:4px;border:1px solid #ccc">
      </label>
      <label style="display:block;margin-top:12px">Email institucional (@alumnos.ufv.es)<br>
        <input type="email" name="email" id="email" required placeholder="usuario@alumnos.ufv.es" style="width:100%;padding:8px;margin-top:6px;border-radius:4px;border:1px solid #ccc">
      </label>
      <label style="display:block;margin-top:12px">Contraseña<br>
        <input type="password" name="password" id="password" required placeholder="mínimo 6 caracteres" style="width:100%;padding:8px;margin-top:6px;border-radius:4px;border:1px solid #ccc">
      </label>
      <label style="display:block;margin-top:12px">Confirmar contraseña<br>
        <input type="password" name="password2" id="password2" required placeholder="repite la contraseña" style="width:100%;padding:8px;margin-top:6px;border-radius:4px;border:1px solid #ccc">
      </label>

      <div id="form-error" class="note" style="margin-top:10px;color:#c0392b"></div>

      <div style="margin-top:14px">
        <button type="submit">Crear cuenta</button>
      </div>
    </form>
  </div>
</main>
<script src="js/auth.js" defer></script>
</body>
</html>
