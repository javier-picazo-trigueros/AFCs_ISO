<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Actividades - AFCs UFV</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="https://www.ufv.es/wp-content/uploads/2020/01/cropped-favicon-32x32.png">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/logo-ufv.jpg" alt="Logo UFV">
            <span>AFCs UFV</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li data-auth="guest-only"><a href="register.html">Registro/Login</a></li>
                <li data-auth="user-only"><a href="catalogo.html" class="active">Catálogo</a></li>
                <li data-auth="user-only"><a href="inscripciones.html">Mis Inscripciones</a></li>
                <li data-auth="user-only"><a href="progreso.html">Mi Progreso</a></li>
                <li data-auth="admin-only"><a href="admin-panel.html">Panel Admin</a></li>
                <li data-auth="user-only" id="logout-li"><a href="#" id="logout-link">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 style="color: var(--ufv-blue); margin-bottom: 2rem;">Catálogo de Actividades</h1>
        
        <div class="filter-bar">
            <input type="text" id="search" placeholder="Buscar por nombre o palabra clave...">
            <select id="filter-ects">
                <option value="">Todos los ECTS</option>
                <option value="lt1">Menos de 1 crédito</option>
                <option value="1-2">1 a 2 créditos</option>
                <option value="2-3">2 a 3 créditos</option>
                <option value="gte3">3 o más créditos</option>
            </select>
            <select id="filter-disponible">
                <option value="">Cualquier disponibilidad</option>
                <option value="1">Con plazas disponibles</option>
                <option value="0">Sin plazas</option>
            </select>
            <button id="btn-clear" class="btn btn-secondary">Limpiar</button>
        </div>

        <div id="catalog-list">
            <!-- Las actividades se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Modal para Ver Más -->
    <div id="activity-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <input type="hidden" id="modal-activity-id">
            </div>
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div>
                        <p><strong>Créditos ECTS:</strong> <span id="modal-ects"></span></p>
                        <p><strong>Modalidad:</strong> <span id="modal-modalidad">Presencial</span></p>
                    </div>
                    <div>
                        <p><strong>Fecha de inicio:</strong> <span id="modal-fecha-inicio"></span></p>
                        <p><strong>Fecha de fin:</strong> <span id="modal-fecha-fin"></span></p>
                    </div>
                </div>
                <hr>
                <h3>Descripción</h3>
                <p id="modal-description"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
